<style>
  :root{--ink:#2a1638;--pink:#ff6fb1;--yellow:#ffd23f;--blue:#4dabf7;--green:#51cf66;--red:#ff6b81;--cream:#fff8ec}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#7fd4ff;color:var(--ink);
    font-family:'Fredoka','Arial Rounded MT Bold','Nunito',system-ui,-apple-system,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
  button{-webkit-appearance:none;appearance:none;touch-action:manipulation;outline:none;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer}
  #app{position:relative;width:100%;max-width:430px;margin:0 auto;overflow:hidden;height:100vh;height:-webkit-fill-available;height:100dvh;background:#7fd4ff}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  #probe{position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}

  .outline{color:#fff;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),0 7px 0 var(--ink)}

  #hud{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));padding:0 14px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none;transition:opacity .4s}
  .pill{font-size:17px;padding:6px 14px;border-radius:999px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);white-space:nowrap}
  #mute{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);font-size:18px}

  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:calc(20px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    text-align:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
  .screen.active{opacity:1;pointer-events:auto}

  .btn{font-size:20px;letter-spacing:.5px;color:#fff;background:var(--pink);border:4px solid var(--ink);border-radius:20px;padding:14px 26px;box-shadow:0 7px 0 var(--ink);text-shadow:0 2px 0 rgba(42,22,56,.45)}
  .btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
  .btn.big{font-size:26px;padding:16px 34px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* title */
  #s-title{justify-content:space-between;padding-top:calc(54px + env(safe-area-inset-top))}
  .logo{font-size:60px;line-height:.95;letter-spacing:1px;transform:rotate(-3deg);animation:logoBob 2.2s ease-in-out infinite}
  .logo .l1{display:block;color:#fff}
  .logo .l2{display:block;color:var(--yellow);font-size:74px}
  @keyframes logoBob{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
  .tag{margin-top:16px;display:inline-block;font-size:16px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:5px 16px;box-shadow:0 4px 0 var(--ink)}
  .tiny{margin-top:12px;font-size:13px;color:#fff;text-shadow:0 2px 0 var(--ink);opacity:.95}

  /* level banner */
  #s-lvl{justify-content:center;background:rgba(42,22,56,.0)}
  #lvlCard{background:var(--yellow);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:18px 30px;transform:scale(.2) rotate(-6deg);opacity:0}
  #s-lvl.active #lvlCard{animation:cardIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes cardIn{to{transform:scale(1) rotate(-2deg);opacity:1}}
  #lvlNum{font-size:20px;letter-spacing:3px}
  #lvlName{font-size:30px;line-height:1.05;margin-top:4px}

  /* quiz card */
  .card{width:100%;background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);padding:26px 16px 16px;position:relative}
  .badge{position:absolute;top:-17px;left:16px;background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
  .q{font-size:21px;line-height:1.2;margin-bottom:14px}

  .answers{display:flex;flex-direction:column;gap:10px;position:relative}
  .ans{font-size:19px;padding:12px 14px;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);color:#fff;text-shadow:0 2px 0 rgba(42,22,56,.4);transition:transform .2s,opacity .3s,background .2s}
  .ans:nth-child(1){background:var(--red)} .ans:nth-child(2){background:var(--blue)} .ans:nth-child(3){background:#f5b800;color:var(--ink);text-shadow:none} .ans:nth-child(4){background:var(--green)}
  .ans:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .ans.win{background:var(--yellow)!important;color:var(--ink);text-shadow:none;animation:win .6s ease}
  .ans.dim{opacity:.35;pointer-events:none}
  .ans.run{position:relative}
  .ans.gone{transform:scale(0) rotate(40deg)!important;opacity:0;pointer-events:none}
  @keyframes win{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg)}60%{transform:scale(.97) rotate(1.5deg)}100%{transform:scale(1)}}
  .reply{min-height:26px;margin-top:12px;font-size:18px;color:#e0307a;opacity:0;transform:translateY(8px);transition:all .3s}
  .reply.show{opacity:1;transform:none}

  /* cups */
  #cupArea{position:relative;height:130px;margin:6px 0 6px}
  .cup{position:absolute;top:30px;width:84px;height:92px;transition:left .38s cubic-bezier(.5,0,.3,1)}
  .cup .under{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:34px;text-align:center;line-height:1}
  .cup .under i{display:block;font-style:normal;font-size:12px;color:#e0307a;margin-top:2px}
  .cup .body{position:absolute;inset:0;border:4px solid var(--ink);border-radius:16px 16px 34px 34px;box-shadow:0 5px 0 var(--ink);transition:transform .35s cubic-bezier(.3,1.5,.5,1);background:linear-gradient(180deg,#fff 0,#fff 0)}
  .cup .body::after{content:'';position:absolute;left:12px;top:10px;width:12px;height:42px;border-radius:8px;background:rgba(255,255,255,.55)}
  .cup:nth-child(1) .body{background:var(--red)} .cup:nth-child(2) .body{background:var(--blue)} .cup:nth-child(3) .body{background:#f5b800}
  .cup.up .body{transform:translateY(-62px) rotate(-14deg)}
  .cup.hint .body{animation:hint .5s ease infinite}
  @keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* cake */
  #s-cake .card{padding-top:24px}
  .meter{display:flex;gap:8px;justify-content:center;margin:2px 0 12px}
  .meter i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:#fff;transition:all .25s}
  .meter i.on{background:var(--yellow);transform:scale(1.15)}

  /* final */
  #s-final{background:linear-gradient(180deg,rgba(42,22,56,.0) 0,rgba(42,22,56,.35) 40%,rgba(42,22,56,.75) 100%)}
  #fCard{width:100%;background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);padding:22px 16px 16px;position:relative}
  #finalTitle{font-size:28px;line-height:1.05;color:#e0307a;margin-bottom:8px}
  #stats{font-size:15px;margin-bottom:10px;color:#6b3fa0}
  #msg{font-size:17px;line-height:1.45;min-height:150px;font-weight:500}
  #again{margin-top:12px;opacity:0;pointer-events:none;transition:opacity .4s}
  #again.show{opacity:1;pointer-events:auto}
  #brand{margin-top:12px;border:3px dashed var(--ink);border-radius:18px;padding:10px;display:none;font-size:14px}
  #brand em{font-style:normal;font-weight:700;background:var(--pink);color:#fff;border-radius:999px;padding:5px 12px;display:inline-block;margin-top:6px}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
  .flash.go{animation:flash .5s ease}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  @media (max-height:740px){
    .logo{font-size:50px}.logo .l2{font-size:62px}.q{font-size:18px;margin-bottom:10px}.ans{font-size:17px;padding:10px 12px}.card{padding-top:22px}
    #msg{font-size:15px;min-height:130px}#finalTitle{font-size:24px}#cupArea{height:118px}
  }
  @media (max-width:360px){.logo{font-size:46px}.logo .l2{font-size:58px}.ans{font-size:16px}}
</style>

<body>

</div>

<script>
/* ---------- EDIT THIS: everything personal lives here ---------- */
const CONFIG = {
  name: 'MAYA',
  age: 18,
  brand: '@yourbrand',
  showBrandCard: false,          // set to true to show your brand card (for reels)
  skin: '#a56a43',
  hair: '#2b170e',
  finalTitle: 'HAPPY 18TH BIRTHDAY, MAYA!',
  finalMessage: 'The mirror said it, the castle said it, and the whole kingdom agrees: you are the prettiest, the princess AND the queen. Welcome to 18, Maya. May this new chapter be full of big dreams, great memories and everything that makes you smile. Cheers to you! 🥂👑',
  levels: [
    { tag: 'WORLD 1-1', name: 'MIRROR, MIRROR', q: 'Mirror, mirror on the wall... who is the <b>PRETTIEST</b> of them all?',
      a: ['Maya 👑', 'Maya (obviously)', 'Maya, no contest', 'Maya... next question?'], reply: 'The mirror says: MAYA! ✨' },
    { tag: 'WORLD 1-2', name: 'THE PRINCESS', q: 'Who is the <b>PRINCESS</b> of this whole party?',
      a: ['Someone else', 'Princess Maya', 'Maya (again)', 'Her Highness Maya'], reply: 'Nobody else was invited to compete 😌' },
    { tag: 'WORLD 1-3', name: 'THE QUEEN', q: 'Find the <b>QUEEN</b>! Watch the crown...' },
    { tag: 'WORLD 1-4', name: 'MAKE A WISH', q: 'Time to blow out the candles! Tap fast!' }
  ]
};
/* --------------------------------------------------------------- */

const $ = s => document.querySelector(s);
const canvas = $('#c'), ctx = canvas.getContext('2d');
const AUTO = location.hash === '#auto';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const OL = '#2a1638';
const rnd = (a, b) => a + Math.random() * (b - a);

let W = 390, H = 844, dpr = 1, insetT = 0, insetB = 0;
let scene = 'title';        // title | map | lvl | quiz | cups | cake | final
let t = 0, last = 0, lvl = 0, crowns = 0, answered = false, mapFrom = -1, mapTo = 0;
let sched = [], parts = [], floats = [], typingTimer = null, flashT = 0;
let actx = null, master = null, noiseBuf = null, muted = false, nextStepT = 0, stepIdx = 0, musicOn = false, began = false;
let tile = null;
const maya = { x: 0, y: 0, h: 200, pose: 'idle', poseT: 0, hop: 0, hopFrom: [0, 0], hopTo: [0, 0], blink: 0, nextBlink: 2, sq: 1, look: 0, bouquet: false };
const SCREENS = ['s-title', 's-lvl', 's-quiz', 's-cups', 's-cake', 's-final'];

/* ---------------- tiny helpers ---------------- */
function show(id){ SCREENS.forEach(s => $('#' + s).classList.toggle('active', s === id)); }
function after(sec, fn){ sched.push({ at: t + sec, fn }); }
function flash(){ const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function typeText(el, text, speed, done){
  clearInterval(typingTimer); el.textContent = '';
  const chars = Array.from(text); let i = 0;
  typingTimer = setInterval(() => {
    el.textContent += chars[i++];
    if (i >= chars.length){ clearInterval(typingTimer); if (done) done(); }
  }, speed);
}

/* ---------------- audio: bouncy chiptune (all synthesized, original tune) ---------------- */
function initAudio(){
  if (actx) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {   // silent looping <audio> makes iPhones play Web Audio even with the ringer switch on silent
      const n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      const a = document.createElement('audio');
      a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', '');
      const pp = a.play(); if (pp && pp.catch) pp.catch(() => {});
    } catch (e) {}
    actx = new C();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.8;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; master = null; }
}
function env(g, tt, a, peak, d){
  g.gain.setValueAtTime(0.0001, tt);
  g.gain.linearRampToValueAtTime(peak, tt + a);
  g.gain.exponentialRampToValueAtTime(0.0001, tt + a + d);
}
function tone(tt, freq, type, peak, dur, endFreq){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, tt);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, tt + dur * 0.9);
  env(g, tt, 0.004, peak, dur);
  o.connect(g); g.connect(master);
  o.start(tt); o.stop(tt + dur + 0.05);
}
function noiseHit(tt, hp, bp, dur, peak){
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = bp ? 'bandpass' : 'highpass';
  f.frequency.value = bp || hp;
  const g = actx.createGain();
  env(g, tt, 0.001, peak, dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(tt, Math.random() * 0.5);
  s.stop(tt + dur + 0.05);
}
const BPMM = 128, stepD = 60 / BPMM / 2;
const MELM = [
  [659, 0, 784, 659, 1047, 0, 784, 0],
  [659, 0, 880, 659, 1047, 0, 880, 0],
  [698, 0, 880, 698, 1047, 880, 698, 0],
  [587, 784, 988, 784, 1175, 988, 784, 0]
];
const BASSM = [130.81, 110, 87.31, 98];
function schedStep(idx, tt){
  const b = Math.floor(idx / 8), s = ((idx % 8) + 8) % 8, bi = ((b % 4) + 4) % 4;
  if (s === 0 || s === 4){ tone(tt, 150, 'sine', 0.5, 0.14, 48); }
  if (s === 2 || s === 6) noiseHit(tt, 0, 2200, 0.07, 0.16);
  if (s % 2 === 1) noiseHit(tt, 8000, 0, 0.025, 0.05);
  if (s === 0 || s === 3 || s === 4 || s === 7) tone(tt, BASSM[bi], 'triangle', 0.3, 0.2);
  const f = MELM[bi][s];
  if (f){ tone(tt, f, 'square', 0.055, 0.17); if (s === 0 || s === 4) tone(tt, f / 2, 'square', 0.025, 0.2); }
}
function pump(){
  if (!actx || !musicOn) return;
  while (nextStepT < actx.currentTime + 0.2){ schedStep(stepIdx, nextStepT); nextStepT += stepD; stepIdx++; }
}
function sfx(kind, n){
  if (!actx || muted) return;
  const tt = actx.currentTime + 0.005;
  if (kind === 'pop'){ tone(tt, 520, 'square', 0.08, 0.07, 880); }
  else if (kind === 'hop'){ tone(tt, 300, 'square', 0.07, 0.14, 760); }
  else if (kind === 'good'){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(tt + i * 0.065, f, 'square', 0.07, 0.16)); tone(tt + 0.33, 1046.5, 'triangle', 0.1, 0.5); }
  else if (kind === 'run'){ tone(tt, 900, 'sine', 0.1, 0.12, 1600); tone(tt + 0.1, 1500, 'sine', 0.08, 0.1, 700); }
  else if (kind === 'crown'){ [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(tt + i * 0.09, f, 'square', 0.07, 0.3)); [261.63, 329.63, 392].forEach(f => tone(tt + 0.45, f, 'triangle', 0.12, 0.8)); }
  else if (kind === 'swap'){ tone(tt, 240 + (n || 0) * 30, 'triangle', 0.1, 0.12, 420 + (n || 0) * 30); noiseHit(tt, 3000, 0, 0.08, 0.04); }
  else if (kind === 'lift'){ tone(tt, 400, 'square', 0.06, 0.1, 900); }
  else if (kind === 'blow'){ noiseHit(tt, 0, 900, 0.5, 0.2); }
  else if (kind === 'win'){
    const m = [523.25, 659.25, 783.99, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568];
    m.forEach((f, i) => tone(tt + i * 0.11, f, 'square', 0.07, 0.22));
    [261.63, 392, 523.25].forEach(f => tone(tt + 1.1, f, 'triangle', 0.14, 1.4)); [1046.5, 1318.5, 1568].forEach(f => tone(tt + 1.1, f, 'square', 0.05, 1.2));
  }
}

/* ---------------- geometry ---------------- */
let NODES = [];
function resize(){
  const r = $('#app').getBoundingClientRect();
  W = r.width || 390; H = r.height || 844;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const cs = getComputedStyle($('#probe'));
  insetT = parseFloat(cs.paddingTop) || 0;
  insetB = parseFloat(cs.paddingBottom) || 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.beginPath(); ctx.moveTo(cx, cy - chh - cw * 0.9); ctx.lineTo(cx, cy - chh - cw * 0.9 - 24); ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - chh - cw * 0.9 - 24); ctx.lineTo(cx + 22 + Math.sin(t * 5) * 3, cy - chh - cw * 0.9 - 17); ctx.lineTo(cx, cy - chh - cw * 0.9 - 10); ctx.closePath(); fillStroke('#ff4d6d', 2);
      ctx.beginPath(); ctx.ellipse(cx, cy - chh * 0.62, cw * 0.14, cw * 0.22, 0, 0, TAU); fillStroke('#7a5cff', 2.4);
    }
    hillsDraw(H * 0.93, H * 0.04, '#7be08a', 3, 0.8, 10);
  } else if (ti === 3){
    // throne room: curtains + throne + spotlight
    for (const sd of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(sd < 0 ? 0 : W, 0); ctx.lineTo(sd < 0 ? W * 0.3 : W * 0.7, 0); ctx.quadraticCurveTo(sd < 0 ? W * 0.18 : W * 0.82, H * 0.3, sd < 0 ? W * 0.08 : W * 0.92, H * 0.62); ctx.lineTo(sd < 0 ? 0 : W, H * 0.62); ctx.closePath(); fillStroke('#e8344f', 3);
      ctx.strokeStyle = 'rgba(42,22,56,.25)'; ctx.lineWidth = 3; for (let i = 1; i < 4; i++){ ctx.beginPath(); ctx.moveTo(sd < 0 ? W * 0.07 * i : W - W * 0.07 * i, 0); ctx.quadraticCurveTo(sd < 0 ? W * 0.05 * i : W - W * 0.05 * i, H * 0.3, sd < 0 ? W * 0.025 * i : W - W * 0.025 * i, H * 0.6); ctx.stroke(); }
    }
    ctx.beginPath(); ctx.moveTo(W * 0.3, H * 0.6); ctx.lineTo(W * 0.3, H * 0.2); ctx.quadraticCurveTo(W * 0.5, H * 0.06, W * 0.7, H * 0.2); ctx.lineTo(W * 0.7, H * 0.6); ctx.closePath(); fillStroke('#ffcf3f', 4);
    ctx.beginPath(); ctx.moveTo(W * 0.35, H * 0.58); ctx.lineTo(W * 0.35, H * 0.23); ctx.quadraticCurveTo(W * 0.5, H * 0.12, W * 0.65, H * 0.23); ctx.lineTo(W * 0.65, H * 0.58); ctx.closePath(); fillStroke('#a63df0', 3);
    starPath(W * 0.5, H * 0.16, 16, 0.5); fillStroke('#fff3a0', 2.4);
    ctx.fillStyle = '#ffcf3f'; ctx.fillRect(0, H * 0.62, W, H * 0.4); ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.strokeRect(-5, H * 0.62, W + 10, H * 0.4);
  } else {
    bunting(H * 0.05, ['#ff6fb1', '#ffd23f', '#4dabf7', '#51cf66', '#ff9f43']);
    for (let i = 0; i < 7; i++){
      const bx = (i + 0.5) / 7 * W + Math.sin(t * 0.8 + i) * 14, by = H - ((t * (30 + i * 6) + i * 140) % (H + 160)) + 60, cols = ['#ff6fb1', '#4dabf7', '#ffd23f', '#51cf66', '#ff9f43', '#a98bff', '#ff6b81'];
      ctx.beginPath(); ctx.moveTo(bx, by + 34); ctx.quadraticCurveTo(bx + Math.sin(t * 2 + i) * 8, by + 70, bx, by + 96); ctx.strokeStyle = 'rgba(42,22,56,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(bx, by, 22, 28, 0, 0, TAU); fillStroke(cols[i], 3); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(bx - 8, by - 10, 4, 8, 0.4, 0, TAU); ctx.fill();
    }
  }
  // floaty decor
  for (const d of decor){
    const x = d.x * W + Math.sin(t * 0.9 + d.ph) * 10, y = ((d.y * H + t * (6 + d.r * 4)) % (H + 40)) - 20, r = 7 * d.r, cols = ti === 0 ? ['#ffd23f', '#ff6fb1', '#fff'] : ['#fff3a0', '#ffc3ec', '#fff'];
    ctx.globalAlpha = 0.85;
    if (d.k === 0){ starPath(x, y, r * 1.2, 0.5); fillStroke(cols[0], 1.8); } else if (d.k === 1){ heartPath(x, y, r); fillStroke(cols[1], 1.8); } else { circ(x, y, r * 0.55, cols[2], 1.6); }
    ctx.globalAlpha = 1;
  }
}
function drawMap(){
  // dotted road
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++){
    const a = NODES[i], b = NODES[i + 1], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + (i % 2 ? 40 : -40);
    ctx.strokeStyle = OL; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(mx + (i % 2 ? -50 : 50), my, b[0], b[1]); ctx.stroke();
    ctx.strokeStyle = i < lvl ? '#ffd23f' : '#fff8ec'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(mx + (i % 2 ? -50 : 50), my, b[0], b[1]); ctx.stroke();
  }
  const icons = ['🪞', '🏰', '👑', '🎂'];
  NODES.forEach((p, i) => {
    const done = i < lvl, r = W * 0.085, bob = Math.sin(t * 3 + i) * 3;
    ctx.beginPath(); ctx.arc(p[0], p[1] + bob, r, 0, TAU); fillStroke(done ? '#ffd23f' : (i === mapTo ? '#ff6fb1' : '#ffffff'), 4);
    ctx.font = Math.round(r * 1.15) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(icons[i], p[0], p[1] + bob + 2);
    if (done){ starPath(p[0] + r * 0.85, p[1] + bob - r * 0.85, 13, 0.5); fillStroke('#51cf66', 2.2); }
    ctx.font = '700 15px Fredoka, "Arial Rounded MT Bold", sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = OL; ctx.strokeText('1-' + (i + 1), p[0], p[1] + r + 20); ctx.fillStyle = '#fff'; ctx.fillText('1-' + (i + 1), p[0], p[1] + r + 20);
  });
}
function drawCake(){
  const cx = W / 2, by = H * 0.43, lit = cakeLit;
  // plate
  ctx.beginPath(); ctx.ellipse(cx, by + 6, 120, 18, 0, 0, TAU); fillStroke('#ffffff', 3);
  // bottom tier
  ctx.beginPath(); ctx.rect(cx - 100, by - 56, 200, 58); fillStroke('#ff8fc3', 3);
  ctx.beginPath(); ctx.moveTo(cx - 100, by - 56); for (let i = 0; i < 8; i++){ const x0 = cx - 100 + i * 25; ctx.quadraticCurveTo(x0 + 12.5, by - 30 + (i % 2) * 6, x0 + 25, by - 56); } ctx.closePath(); fillStroke('#fff3f8', 2.6);
  // top tier
  ctx.beginPath(); ctx.rect(cx - 66, by - 106, 132, 52); fillStroke('#7fd4ff', 3);
  ctx.beginPath(); ctx.moveTo(cx - 66, by - 106); for (let i = 0; i < 5; i++){ const x0 = cx - 66 + i * 26.4; ctx.quadraticCurveTo(x0 + 13.2, by - 82 + (i % 2) * 6, x0 + 26.4, by - 106); } ctx.closePath(); fillStroke('#fff3f8', 2.6);
  for (let i = 0; i < 7; i++) circ(cx - 90 + i * 30, by - 22, 4, i % 2 ? '#ffd23f' : '#fff', 1.6);
  // number candles 1 and 8
  const flick = 0.9 + Math.sin(t * 14) * 0.1;
  function candle(x, label, col){
    ctx.beginPath(); ctx.rect(x - 15, by - 160, 30, 54); fillStroke(col, 3);
    ctx.font = '700 40px Fredoka, "Arial Rounded MT Bold", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 5; ctx.strokeStyle = OL; ctx.strokeText(label, x, by - 133); ctx.fillStyle = '#fff'; ctx.fillText(label, x, by - 133);
    ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, by - 160); ctx.lineTo(x, by - 168); ctx.stroke();
    if (lit > 0.02){
      const fh = 30 * lit * flick, fw = 13 * lit;
      const fg = ctx.createRadialGradient(x, by - 178, 0, x, by - 178, 46 * lit); fg.addColorStop(0, 'rgba(255,220,120,.6)'); fg.addColorStop(1, 'rgba(255,220,120,0)'); ctx.fillStyle = fg; ctx.fillRect(x - 50, by - 230, 100, 100);
      ctx.beginPath(); ctx.moveTo(x, by - 168); ctx.bezierCurveTo(x - fw * 1.5, by - 172, x - fw * 0.8, by - 168 - fh * 0.8, x + Math.sin(t * 9) * 2, by - 168 - fh); ctx.bezierCurveTo(x + fw * 0.8, by - 168 - fh * 0.8, x + fw * 1.5, by - 172, x, by - 168); fillStroke('#ffb703', 2.4);
      ctx.beginPath(); ctx.ellipse(x, by - 172, fw * 0.45, fh * 0.32, 0, 0, TAU); ctx.fillStyle = '#fff3a0'; ctx.fill();
    }
  }
  candle(cx - 24, '1', '#ff6fb1'); candle(cx + 24, '8', '#4dabf7');
}
let cakeLit = 1;

/* ---------------- particles ---------------- */
function confetti(x, y, n, spread){
  for (let i = 0; i < n && parts.length < 260; i++){
    const a = Math.random() * TAU, sp = (spread || 1) * (80 + Math.random() * 260);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, g: 420, life: 1.2 + Math.random() * 1.2, k: Math.floor(Math.random() * 4), r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, col: ['#ff6fb1', '#ffd23f', '#4dabf7', '#51cf66', '#ff9f43', '#a98bff', '#ffffff'][Math.floor(Math.random() * 7)] });
  }
}
function floatTxt(x, y, text, col){ floats.push({ x, y, text, col: col || '#fff', life: 1.4 }); }

/* ---------------- game flow ---------------- */
function setCrowns(){ $('#crowns').textContent = '👑 ' + crowns + '/4'; }
function hopTo(i, cb){
  const p = NODES[i];
  maya.hop = 0.0001; maya.hopFrom = [maya.x, maya.y]; maya.hopTo = [p[0], p[1]]; maya.pose = 'hop'; maya.cb = cb; sfx('hop');
}
function goMap(i){
  scene = 'map'; mapTo = i; show(null);
  if (i === 0 && lvl === 0){ const p = NODES[0]; maya.x = p[0]; maya.y = p[1] + 40; }
  placeMaya();
  after(0.5, () => {
    const from = NODES[Math.max(0, i - 1)];
    if (i > 0){ maya.x = from[0]; maya.y = from[1]; }
    hopTo(i, () => { maya.pose = 'wave'; after(0.5, () => introLevel(i)); });
  });
}
function introLevel(i){
  lvl = i; scene = 'lvl'; show('s-lvl');
  const L = CONFIG.levels[i];
  $('#lvlNum').textContent = L.tag; $('#lvlName').textContent = L.name;
  sfx('pop');
  after(1.7, () => {
    placeMaya();
    if (i === 0 || i === 1) startQuiz(i); else if (i === 2) startCups(); else startCake();
  });
}
function startQuiz(i){
  scene = 'quiz'; show('s-quiz'); answered = false; placeMaya(); maya.pose = 'idle'; maya.bouquet = false;
  const L = CONFIG.levels[i];
  $('#qTag').textContent = L.tag; $('#qText').innerHTML = L.q;
  for (let k = 0; k < 4; k++){ const el = $('#a' + k); el.textContent = L.a[k]; el.className = 'ans'; el.style.transform = ''; el.style.left = ''; el.style.top = ''; }
  $('#reply').className = 'reply'; $('#reply').textContent = '';
  runTries = 0;
  if (AUTO) after(1.5, () => answer(i === 1 ? 1 : 0));
}
let runTries = 0;
function answer(k){
  if (scene !== 'quiz' || answered) return;
  const L = CONFIG.levels[lvl];
  if (lvl === 1 && k === 0){ dodge(); return; }
  answered = true; sfx('good');
  for (let j = 0; j < 4; j++) $('#a' + j).classList.add(j === k ? 'win' : 'dim');
  $('#reply').textContent = L.reply; $('#reply').classList.add('show');
  maya.pose = 'cheer'; maya.bouquet = false; maya.sq = 1.25; flash(); confetti(maya.x, maya.y - maya.h * 0.6, 40);
  floatTxt(W / 2, H * 0.12, 'CORRECT!', '#fff3a0');
  crowns++; setCrowns();
  after(1.2, () => sfx('crown'));
  after(2.8, () => { maya.pose = 'idle'; goMap(lvl + 1); });
}
function dodge(){
  runTries++; sfx('run');
  const el = $('#a0'), card = el.parentElement;
  if (runTries >= 3){
    el.textContent = 'Okay fine... 😅'; el.classList.add('gone');
    $('#reply').textContent = 'Nobody else was invited to compete 😌'; $('#reply').classList.add('show');
    return;
  }
  el.textContent = runTries === 1 ? "Can't catch me!" : 'Too slow!';
  const dx = (Math.random() < 0.5 ? -1 : 1) * rnd(40, 90), dy = rnd(-20, 50);
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx > 0 ? 8 : -8) + 'deg)';
  maya.sq = 1.2;
}
function startCups(){
  scene = 'cups'; show('s-cups'); placeMaya(); maya.pose = 'idle'; answered = false;
  const L = CONFIG.levels[2];
  $('#cTag').textContent = L.tag; $('#cText').innerHTML = L.q; $('#cReply').className = 'reply'; $('#cReply').textContent = '';
  cupSlot = [0, 1, 2]; cupsLive = false;
  layoutCups(false);
  for (let i = 0; i < 3; i++) $('#cup' + i).className = 'cup';
  after(0.6, () => { $('#cup1').classList.add('up'); sfx('lift'); });
  after(1.9, () => { $('#cup1').classList.remove('up'); $('#cText').innerHTML = 'Shuffling...'; shuffleCups(0); });
}
let cupSlot = [0, 1, 2], cupsLive = false;
function layoutCups(){
  const area = $('#cupArea'), aw = (area.getBoundingClientRect && area.getBoundingClientRect().width) || (W - 60);
  const cw = 84, gap = (aw - cw * 3) / 2;
  for (let i = 0; i < 3; i++) $('#cup' + i).style.left = (cupSlot[i] * (cw + gap)) + 'px';
}
function shuffleCups(n){
  if (n >= 7){
    cupsLive = true; $('#cText').innerHTML = 'Where is the <b>QUEEN</b>? Tap a cup!';
    for (let i = 0; i < 3; i++) $('#cup' + i).classList.add('hint');
    if (AUTO) after(1.4, () => pickCup(1));
    return;
  }
  const a = Math.floor(Math.random() * 3); let b = (a + 1 + Math.floor(Math.random() * 2)) % 3;
  const t1 = cupSlot[a]; cupSlot[a] = cupSlot[b]; cupSlot[b] = t1;
  layoutCups(); sfx('swap', n);
  after(0.5, () => shuffleCups(n + 1));
}
function pickCup(i){
  if (scene !== 'cups' || !cupsLive || answered) return;
  answered = true; cupsLive = false;
  for (let j = 0; j < 3; j++){ $('#cup' + j).classList.remove('hint'); }
  $('#cup' + i).classList.add('up'); sfx('lift');
  after(0.5, () => { for (let j = 0; j < 3; j++) if (j !== i) $('#cup' + j).classList.add('up'); });
  after(0.7, () => { sfx('good'); $('#cReply').textContent = "They're ALL Maya! 👑👑👑"; $('#cReply').classList.add('show'); maya.pose = 'cheer'; maya.sq = 1.25; flash(); confetti(maya.x, maya.y - maya.h * 0.6, 40); floatTxt(W / 2, H * 0.12, 'THE QUEEN!', '#fff3a0'); crowns++; setCrowns(); });
  after(1.9, () => sfx('crown'));
  after(3.4, () => { maya.pose = 'idle'; goMap(3); });
}
let blows = 0;
function startCake(){
  scene = 'cake'; show('s-cake'); placeMaya(); maya.pose = 'idle'; answered = false; cakeLit = 1; blows = 0;
  const L = CONFIG.levels[3];
  $('#kTag').textContent = L.tag; $('#kText').innerHTML = L.q;
  for (let i = 0; i < 3; i++) $('#m' + i).className = '';
  maya.y = H * 0.30; maya.h = H * 0.17; maya.x = W * 0.8;
  if (AUTO){ after(1.2, blow); after(1.9, blow); after(2.6, blow); }
}
function blow(){
  if (scene !== 'cake' || answered) return;
  blows++; sfx('blow'); $('#m' + (blows - 1)).classList.add('on');
  maya.sq = 1.2; maya.pose = 'hop';
  cakeLit = Math.max(0, 1 - blows / 3);
  if (blows >= 3){
    answered = true; cakeLit = 0; crowns++; setCrowns();
    after(0.3, () => { sfx('win'); flash(); confetti(W / 2, H * 0.3, 90, 1.3); maya.pose = 'cheer'; floatTxt(W / 2, H * 0.12, 'HAPPY 18!', '#fff3a0'); });
    after(2.6, showFinal);
  } else after(0.35, () => { if (scene === 'cake') maya.pose = 'idle'; });
}
function showFinal(){
  scene = 'final'; show('s-final'); placeMaya(); maya.pose = 'dance'; maya.bouquet = true;
  $('#finalTitle').textContent = CONFIG.finalTitle;
  $('#stats').textContent = '👑 CROWNS COLLECTED: ' + crowns + '/4';
  $('#again').classList.remove('show');
  typeText($('#msg'), CONFIG.finalMessage, 26, () => { confetti(W / 2, H * 0.3, 60); if (CONFIG.showBrandCard) $('#brand').style.display = 'block'; $('#again').classList.add('show'); });
  confetti(W / 2, H * 0.3, 80, 1.2);
}
function startGame(){
  if (scene !== 'title' && scene !== 'final') return;
  initAudio();
  began = false;
  const begin = () => {
    if (began) return; began = true;
    if (actx && actx.state !== 'running'){ actx = null; master = null; }
    crowns = 0; lvl = 0; setCrowns(); parts = []; floats = []; sched = [];
    musicOn = !!actx; nextStepT = (actx ? actx.currentTime : 0) + 0.15; stepIdx = 0;
    sfx('crown'); flash(); maya.bouquet = false; maya.pose = 'idle';
    goMap(0);
  };
  if (actx && actx.resume){ try { actx.resume().then(begin, begin); } catch (e) { begin(); } setTimeout(begin, 700); } else begin();
}

/* ---------------- update / draw ---------------- */
function update(dt){
  t += dt;
  pump();
  for (let i = sched.length - 1; i >= 0; i--){ if (sched[i].at <= t){ const f = sched[i].fn; sched.splice(i, 1); f(); } }
  maya.sq = lerp(maya.sq, 1, Math.min(1, dt * 8));
  maya.nextBlink -= dt; if (maya.nextBlink <= 0){ maya.blink = 0.12; maya.nextBlink = rnd(2, 4.5); } if (maya.blink > 0) maya.blink -= dt;
  maya.look = Math.sin(t * 0.7) * 0.8;
  if (maya.hop){
    maya.hop += dt / 0.9;
    const k = Math.min(1, maya.hop), e = k * k * (3 - 2 * k);
    maya.x = lerp(maya.hopFrom[0], maya.hopTo[0], e); maya.y = lerp(maya.hopFrom[1], maya.hopTo[1], e) - Math.sin(k * Math.PI) * H * 0.07;
    maya.sq = 1 + Math.sin(k * Math.PI) * 0.12;
    if (k >= 1){ maya.hop = 0; maya.x = maya.hopTo[0]; maya.y = maya.hopTo[1]; sfx('pop'); maya.sq = 0.8; const cb = maya.cb; maya.cb = null; if (cb) cb(); }
  }
  if (scene === 'title' && Math.random() < dt * 2.2) confetti(rnd(0, W), -10, 1, 0.1);
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.995; p.rot += p.vr * dt; }
  for (let i = floats.length - 1; i >= 0; i--){ floats[i].life -= dt; floats[i].y -= 26 * dt; if (floats[i].life <= 0) floats.splice(i, 1); }
}
function draw(){
  ctx.save();
  ctx.clearRect(-20, -20, W + 40, H + 40);
  drawBg();
  if (scene === 'map') drawMap();
  if (scene === 'cake' || (scene === 'final')) { if (scene === 'cake') drawCake(); }
  if (scene !== 'lvl' || maya.y) drawMaya(maya.x, maya.y, maya.h, t);
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life / 0.5, 0, 1); ctx.fillStyle = p.col;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.k === 0) ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); else if (p.k === 1){ ctx.beginPath(); ctx.arc(0, 0, p.r * 0.7, 0, TAU); ctx.fill(); } else if (p.k === 2){ starPath(0, 0, p.r, 0.45); ctx.fill(); } else { heartPath(0, 0, p.r * 0.7); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 34px Fredoka, "Arial Rounded MT Bold", sans-serif'; ctx.lineJoin = 'round';
  for (const f of floats){ ctx.globalAlpha = clamp(f.life / 0.4, 0, 1); const sc = 1 + Math.max(0, f.life - 1.1) * 2; ctx.save(); ctx.translate(f.x, f.y); ctx.scale(sc, sc); ctx.lineWidth = 8; ctx.strokeStyle = OL; ctx.strokeText(f.text, 0, 0); ctx.fillStyle = f.col; ctx.fillText(f.text, 0, 0); ctx.restore(); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function frame(ts){
  if (!last) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

function init(){
  $('#nameL').textContent = CONFIG.name + "'S";
  $('#brandCta').textContent = 'DM "GIFT"  ' + CONFIG.brand;
  makeDecor(); resize();
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  document.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  $('#playBtn').addEventListener('click', startGame);
  $('#again').addEventListener('click', () => { scene = 'title'; startGame(); });
  for (let k = 0; k < 4; k++) $('#a' + k).addEventListener('click', () => { sfx('pop'); answer(k); });
  for (let k = 0; k < 3; k++) $('#cup' + k).addEventListener('click', () => pickCup(k));
  $('#blowBtn').addEventListener('click', blow);
  $('#mute').addEventListener('click', () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; $('#mute').textContent = muted ? '🔇' : '🔊'; });
  setInterval(pump, 25);
  requestAnimationFrame(frame);
}
init();
</script>
</body>
